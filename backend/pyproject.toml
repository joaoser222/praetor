# =============================================================================
# Metadados e dependências do projeto
# =============================================================================
# Fonte única das dependências — não há mais `requirements*.txt`.
#
# Este é uma APLICAÇÃO (roda a partir de `backend/` via `manage.py` e
# `uvicorn main:app`), não uma biblioteca publicável. Por isso `packages = []`
# logo abaixo: o build gera um wheel vazio, de modo que `pip install .` (ou
# `pip install -e ".[dev]"`) instala APENAS as dependências, sem copiar o código
# do projeto para o site-packages.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praetor"
# Fonte única da versão da aplicação: `config.settings.APP_VERSION` deriva daqui
# (importlib.metadata). Mantenha apenas este valor.
version = "0.1.0"
description = "Boilerplate full-stack: FastAPI (apps modulares) + React 19/Vite, orquestrado pela CLI manage.py."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0,<3.0.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "python-multipart>=0.0.9",
    "click>=8.1.7",
    "celery[redis]>=5.4.0",
    "asyncpg>=0.31",
]

[project.optional-dependencies]
# Ferramentas de desenvolvimento e testes (`pip install -e ".[dev]"`).
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8",
    "httpx>=0.27.0",
    "ipython>=8.27.0",
    "ruff>=0.6.0",
    # Usado apenas pelas ferramentas de geração (tools/), não pelo runtime.
    "Jinja2>=3.1.4",
]

# A aplicação não é empacotada (nenhum código é instalado), apenas as
# dependências. Ver a explicação no topo deste arquivo.
[tool.setuptools]
packages = []
py-modules = []

# =============================================================================
# Ferramentas (pytest, ruff)
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "apps"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "asyncio: marca testes assíncronos executados pelo pytest-asyncio.",
]

[tool.ruff]
line-length = 100
exclude = ["migrations/versions", "venv"]

[tool.ruff.lint]
# Apenas regras que apontam defeitos reais (imports quebrados, nomes indefinidos).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pacotes __init__.py reexportam símbolos (models, repositórios, serviços).
"**/__init__.py" = ["F401"]
